name: test-and-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cliproxyapi-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 152.53.55.111
  DEPLOY_USER: fkh
  DEPLOY_PATH: /home/fkh/code/CLIProxyAPI

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Build and verify management panel
        run: bash management-ui/build.sh management-ui/management.html

      - name: Upload verified panel
        uses: actions/upload-artifact@v4
        with:
          name: bps-management-panel
          path: management-ui/management.html
          if-no-files-found: error

      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: |
          go test -p 2 ./...
          go test -race ./examples/plugin/bps/go/... ./internal/runtime/executor/helps/bpsbridge
          go test -race ./internal/runtime/executor -run '^TestBPS'
          go test -race ./internal/runtime/executor/helps -run '^TestBPS'
          go build -o test-output ./cmd/server
          rm test-output
          bash -n .github/scripts/deploy-production.sh

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Install deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/cliproxyapi_deploy"
          chmod 600 "$HOME/.ssh/cliproxyapi_deploy"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Download verified panel
        uses: actions/download-artifact@v4
        with:
          name: bps-management-panel
          path: management-ui

      - name: Update and restart server
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          management_sha=$(sha256sum management-ui/management.html | cut -d ' ' -f 1)
          incoming="/home/fkh/.cpa-backups/panel-$DEPLOY_COMMIT"
          ssh -i "$HOME/.ssh/cliproxyapi_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "install -m 700 -d '$incoming'"
          scp -i "$HOME/.ssh/cliproxyapi_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            management-ui/management.html "$DEPLOY_USER@$DEPLOY_HOST:$incoming/management.html"
          ssh -i "$HOME/.ssh/cliproxyapi_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$DEPLOY_COMMIT' '$incoming/management.html' '$management_sha'" \
            < .github/scripts/deploy-production.sh
